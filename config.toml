# ---------------- Web UI 网页界面 ----------------
web_port     = 8000                # open http://localhost:8000
web_host     = "127.0.0.1"         # "0.0.0.0" = also reachable from other devices on your Wi-Fi
open_browser = true                # open the browser automatically on start

# ---------------- Chart review (复盘) ----------------
# Send the Telegram bot a chart screenshot and it replies with an annotated review chart.
review_model          = "gpt-6-luna"   # must be an OpenAI model that can read images (study/decision use it too unless set)
review_refine_passes  = 1          # extra self-check rounds to fix label positions (0 = faster/cheaper)
review_send_full_resolution = true # also send the review as a file (Telegram compresses photos)
docs_folder           = "docs"     # your study material (.md, .txt, .pdf) used as the knowledge base
# Al Brooks knowledge base (built from the books). The primer file is put into every review prompt;
# the other files in this folder are the full reference. Leave empty to use the short built-in primer.
# While the primer loads, PDFs in docs_folder are skipped (they are the raw books); .md/.txt notes still load.
knowledge_base_folder = "D:/Uchicago Courses/Trading/TradingAIKnowledgeBase"
knowledge_primer      = "11_REVIEW_AGENT_PRIMER.md"
review_snap_targets   = true       # nudge arrows/rings onto the nearest candle high/low (records the original spot)
review_auto_layout    = true       # move labels next to their bars, into empty space (records the model's spot)

# ---------------- TradingReview · Brooks coach: Trade / Review / Study ----------------
# Versioned, hash-checked, read-only Brooks knowledge (managed only with: python -m knowledge.admin ...).
canonical_store         = "D:/Uchicago Courses/Trading/BrooksCanonicalKB"
knowledge_upload_folder = "D:/Uchicago Courses/Trading/TradingKnowledgeUpload"  # extracted text (admin import only)
data_folder             = "data"   # memory.db, agent.db, traces, case files (never inside canonical_store)
study_model             = ""       # empty = same as review_model
decision_model          = ""       # empty = same as review_model; must read images
rag_top_canonical       = 6        # Brooks pages per answer
rag_top_derived         = 4        # derived-note sections per answer
rag_char_budget         = 16000    # max characters of retrieved text per prompt
study_attach_figures    = 1        # attach up to N original book chart pages to study answers (0 = off)
decisive_style          = true     # decision mode: conclusion first (LONG / SHORT / WAIT), then evidence
llm_timeout_seconds     = 300
llm_max_output_tokens   = 20000    # reasoning models (gpt-5.x / gpt-6) count their thinking as output
# Optional cost logging, USD per 1M tokens: [pricing] "gpt-4o" = [input, output]

# ---------------- News alerts ----------------
enable_news_alerts = true          # false = only do chart reviews

# ---------------- Market settings ----------------
# Which market(s) to judge news against. You can also change this from Telegram
# with /market equity, /market gold, /market both, or /market NVDA.
markets = ["EQUITY"]

equity_focus = "S&P 500, Nasdaq-100"
gold_focus   = "XAUUSD spot, COMEX GC futures"
horizon      = "INTRADAY"        # INTRADAY or SWING

# ---------------- Alert settings ----------------
min_impact_to_alert = 3          # 1-5. Only news at or above this strength is sent to Telegram
alert_on_neutral    = false      # Send NEUTRAL verdicts too?
poll_seconds        = 120        # How often to check the feeds
max_item_age_minutes = 180       # Ignore news older than this
quiet_first_run     = true       # On first start, mark existing headlines as seen instead of flooding you

# ---------------- OpenAI settings ----------------
model      = "gpt-4o"            # "gpt-4o-mini" is ~15x cheaper but less sharp; any newer OpenAI model also works
batch_size = 8                   # Headlines analyzed per request

# ---------------- News sources ----------------
# tier: 1 = official / top wire, 2 = established media, 3 = aggregator / unverified.
# Public RSS URLs change from time to time; if one stops working, replace or remove it.
[[feeds]]
name = "Federal Reserve press releases"
url  = "https://www.federalreserve.gov/feeds/press_all.xml"
tier = 1

[[feeds]]
name = "CNBC Top News"
url  = "https://www.cnbc.com/id/100003114/device/rss/rss.html"
tier = 2

[[feeds]]
name = "CNBC Economy"
url  = "https://www.cnbc.com/id/20910258/device/rss/rss.html"
tier = 2

[[feeds]]
name = "MarketWatch Top Stories"
url  = "https://feeds.content.dowjones.io/public/rss/mw_topstories"
tier = 2

[[feeds]]
name = "FXStreet News"
url  = "https://www.fxstreet.com/rss/news"
tier = 2

[[feeds]]
name = "Investing.com Commodities"
url  = "https://www.investing.com/rss/news_11.rss"
tier = 2

[[feeds]]
name = "Google News: gold price"
url  = "https://news.google.com/rss/search?q=gold+price+when:1h&hl=en-US&gl=US&ceid=US:en"
tier = 3

[[feeds]]
name = "Google News: stock market"
url  = "https://news.google.com/rss/search?q=stock+market+OR+Fed+OR+CPI+when:1h&hl=en-US&gl=US&ceid=US:en"
tier = 3

# ======== Tables below (TOML: keep these at the end of the file) ========

# ---------------- Trade assistant 交易助手 (your risk, used by code - not by the model) ----------------
# The trade plan sizes the position so that one stopped-out trade loses at most
# min(account_size * risk_per_trade_pct %, max_risk_per_trade). 0 = not set (no size shown).
[trading]
account_size        = 0          # e.g. 10000 (USD)
risk_per_trade_pct  = 1.0        # % of the account you accept to lose on one trade
max_risk_per_trade  = 0          # optional hard cap in USD (0 = none)
max_contracts       = 0          # optional cap on contracts (0 = none)
min_setup_quality   = "B"        # A / B / C: a TAKE below this grade becomes WAIT
default_symbol      = ""         # used when the chart and your note do not name the instrument, e.g. "MES"
# Minimum reward/risk per probability class before a TAKE is allowed (Brooks' trader's equation)
min_rr_high = 1.0
min_rr_even = 1.5
min_rr_low  = 2.0
# Dollars per 1.0 point per contract; add your instruments (built in: ES MES NQ MNQ YM MYM RTY M2K GC MGC SI SIL CL MCL NG 6E M6E ZB ZN)
[trading.point_values]
# SPY = 1

# ---------------- Live monitoring 实时监控 (next phase; interface ready, not started by the web UI) ----------------
# Run it with:  .venv\Scripts\python agent_cli.py monitor   (Ctrl+C stops). Every analysis is a model call (costs money).
[monitor]
source                   = "csv"     # "csv" = a file your platform keeps exporting, "screenshots" = a folder of chart images
csv_path                 = ""        # e.g. "D:/Trading/export/MES_5m.csv"  (time,open,high,low,close)
forming_last_bar         = false     # true if the export's last row is the bar that is still forming
screenshot_folder        = ""        # e.g. "D:/Trading/shots"
symbol                   = "MES"
timeframe                = "5m"
poll_seconds             = 10
reanalyze_every_bars     = 3         # new model analysis after this many new closed bars (not while a plan is in a trade)
max_model_calls_per_hour = 12
notify                   = "changes" # "changes" = only when the call changes / a trigger hits, "all" = every analysis
notify_channel           = "telegram" # "telegram" (if configured) or "console"
